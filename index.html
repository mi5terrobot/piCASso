<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/temml@0.14.0/dist/Temml-Local.css">
    <script src="https://cdn.jsdelivr.net/npm/temml@0.14.0/dist/temml.min.js"></script>
    <link href="https://cdnfonts.com" rel="stylesheet">
    <link rel="stylesheet" href="assets/fonts.css">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <main class="wrap">

        <section class="beispiel" id="nullstellen-bestimmen">
            <div class="thema">Nullstellen bestimmen</div>
            <div class="aufgabe">
                Bestimme die Nullstellen von <span class="tex">f(x) = - \frac{1}{2} x^2 + 3x - 4</span>.
            </div>
            <div class="schritte">
                <div class="schritt">
                    <p>Tippe <span class="key abc">solve(</span> oder <span class="key cas">b 3 1</span></p>
                    <p><img src="images/nullstellen-1.jpg" alt=""></p>
                </div>
                <div class="schritt">
                    <p>Tippe die Gleichung mit <span class="key abc">=0</span> ein und dahinter <br>Komma und Variable <span class="key abc">x</span>.</p>
                    <p><img src="images/nullstellen-2.jpg" alt=""></p>
                    <p>Lösung: <span class="tex lsg">x_1 = 2,\ x_2 = 4</span></p>
                </div>
            </div>
            <div class="navigation"></div>
        </section>

    </main>

    <script src="assets/script.js"></script>
    
</body>
</html>
